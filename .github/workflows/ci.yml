name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    # package.json engines says node >=18: test the floor, the LTS lines and current.
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22', '24', '26']
    uses: agent-sh/.github/.github/workflows/ci-node.yml@main
    with:
      node-version: ${{ matrix.node }}
    secrets: inherit

  agnix:
    uses: agent-sh/.github/.github/workflows/ci-agnix.yml@main
