name: Sync to consumers

on:
  push:
    branches: [main]
    paths: ['lib/**', 'templates/**', 'scripts/generate-claudemd.js']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [agentsys, next-task, ship, enhance, deslop, learn, consult, debate, drift-detect, sync-docs, audit-project, perf, web-ctl]
    steps:
      - name: Checkout agent-core
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: agent-sh/${{ matrix.repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      - name: Sync lib (additive — preserve downstream-only files)
        run: |
          # rsync WITHOUT --delete: agent-core's files are copied into the
          # consumer's lib/, but any file that exists only downstream (e.g.
          # lib/repo-intel/queries.js in agentsys) is preserved. The earlier
          # `rm -rf target/lib/ && cp -r` mirrored upstream and silently
          # deleted downstream-only code — see 2026-04-26 sync regression
          # that wiped 300 LOC from agentsys on v0.4.1 propagation.
          mkdir -p target/lib
          rsync -a source/lib/ target/lib/

      - name: Generate CLAUDE.md
        run: node source/scripts/generate-claudemd.js --target target --template source/templates/CLAUDE.md.tmpl

      - name: Check for changes
        id: diff
        working-directory: target
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: agent-sh/${{ matrix.repo }}
          REPO_NAME: ${{ matrix.repo }}
        run: |
          BRANCH="chore/sync-core-${REPO_NAME}-$(date +%Y%m%d-%H%M%S)"
          git config user.name "agent-core-bot"
          git config user.email "noreply@agent-sh.github.io"
          git checkout -b "$BRANCH"
          git add lib/ CLAUDE.md
          git commit -m "chore: sync core lib and CLAUDE.md from agent-core"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$TARGET_REPO" \
            --base main \
            --title "chore: sync core lib and CLAUDE.md from agent-core" \
            --body "Automated sync of lib/ and CLAUDE.md from [agent-core](https://github.com/agent-sh/agent-core)." \
            --head "$BRANCH"
